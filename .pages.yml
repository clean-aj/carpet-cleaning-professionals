# Pages CMS configuration – https://pagescms.org/docs/configuration/
# Log in at https://app.pagescms.org with GitHub and choose this repository.

media:
  input: src/images
  output: /images

content:
  - name: home
    label: Home page
    type: file
    path: src/content/home.md
    fields:
      - { name: title, label: Page name, type: string, required: true }
      - { name: metaTitle, label: SEO title (50–60 characters), type: string }
      - { name: description, label: Meta description (120–160 characters), type: text }
      - { name: heading, label: Main heading (H1), type: string }
      - { name: intro, label: Intro text, type: text }
      - { name: highlights, label: Highlights (ticks under the hero), type: string, list: true }
      - { name: featuresHeading, label: '"Why choose us" heading', type: string }
      - name: features
        label: '"Why choose us" points'
        type: object
        list: true
        fields:
          - { name: title, label: Title, type: string }
          - { name: text, label: Text, type: text }
      - name: gallery
        label: '"See the difference" photos'
        type: object
        list: true
        fields:
          - { name: image, label: Photo, type: image }
          - { name: alt, label: Photo description (alt text), type: text }
      - { name: introImage, label: Image next to the intro text, type: image }
      - { name: introImageAlt, label: Intro image description (alt text), type: text }
      - { name: body, label: Main content, type: rich-text }

  - name: pages
    label: Pages
    type: collection
    path: src/content/pages
    view:
      fields: [title, description]
    fields:
      - { name: title, label: Page title, type: string, required: true }
      - { name: metaTitle, label: SEO title (50–60 characters), type: string }
      - { name: description, label: Meta description (120–160 characters), type: text }
      - { name: intro, label: Intro text, type: text }
      - { name: image, label: Main image, type: image }
      - { name: imageAlt, label: Image description (alt text), type: text }
      - { name: body, label: Content, type: rich-text }

  - name: services
    label: Services
    type: collection
    path: src/content/services
    view:
      fields: [title, order]
      default:
        sort: order
        order: asc
    fields:
      - { name: title, label: Service name, type: string, required: true }
      - { name: metaTitle, label: SEO title (50–60 characters), type: string }
      - { name: description, label: Meta description (120–160 characters), type: text }
      - { name: summary, label: Card summary (shown in service lists), type: text }
      - { name: intro, label: Intro text, type: text }
      - { name: order, label: Order in lists, type: number }
      - name: faqs
        label: FAQs
        type: object
        list: true
        fields:
          - { name: question, label: Question, type: string }
          - { name: answer, label: Answer, type: text }
      - { name: image, label: Main image (1200×630, descriptive file name), type: image }
      - { name: imageAlt, label: Image description (alt text), type: text }
      - { name: body, label: Content, type: rich-text }

  - name: posts
    label: Blog posts
    type: collection
    path: src/content/posts
    filename: "{year}-{month}-{day}-{primary}.md"
    view:
      fields: [title, date, draft]
      default:
        sort: date
        order: desc
    fields:
      - { name: title, label: Title, type: string, required: true }
      - { name: description, label: Meta description (120–160 characters), type: text, required: true }
      - { name: date, label: Publish date, type: date, required: true }
      - { name: draft, label: Draft (hide from site), type: boolean, default: false }
      - { name: image, label: Main image (1200×630, descriptive file name), type: image }
      - { name: imageAlt, label: Image description (alt text), type: text }
      - { name: body, label: Content, type: rich-text }

  - name: locations
    label: Locations
    type: collection
    path: src/content/locations
    # The file name is the page URL: carpet-cleaning-reading.md → /carpet-cleaning-reading/
    filename: "carpet-cleaning-{primary}.md"
    view:
      primary: town
      fields: [town, county, region]
      default:
        sort: town
        order: asc
    fields:
      - { name: town, label: Town or city, type: string, required: true }
      - { name: county, label: County (e.g. West Sussex), type: string, required: true }
      - name: region
        label: Region group
        type: select
        required: true
        options:
          values: [London, Surrey, Sussex, Hampshire, Berkshire, Buckinghamshire, Hertfordshire, Oxfordshire, Dorset, South West England, South Wales, North West]
      - { name: featured, label: Popular location (shown first and on the Areas page), type: boolean, default: false }
      - { name: wikipedia, label: Wikipedia page for the town (helps Google identify it), type: string }
      - { name: title, label: Page heading (H1), type: string, required: true }
      - { name: metaTitle, label: SEO title (50–60 characters), type: string }
      - { name: description, label: Meta description (120–160 characters), type: text }
      - { name: intro, label: Intro text, type: text }
      - { name: image, label: Main image (1200×630, descriptive file name), type: image }
      - { name: imageAlt, label: Image description (alt text), type: text }
      - name: faqs
        label: FAQs
        type: object
        list: true
        fields:
          - { name: question, label: Question, type: string }
          - { name: answer, label: Answer, type: text }
      - { name: draft, label: Draft (hide from site), type: boolean, default: false }
      - { name: body, label: Content, type: rich-text }

  - name: slider
    label: Photo slider (town pages)
    type: file
    path: src/_data/slider.json
    fields:
      - { name: heading, label: Heading, type: string }
      - name: photos
        label: Photos
        type: object
        list: true
        fields:
          - { name: image, label: Photo, type: image }
          - { name: alt, label: Photo description (alt text), type: text }

  - name: site
    label: Site settings
    type: file
    path: src/_data/site.json
    fields:
      - { name: name, label: Business name, type: string, required: true }
      - { name: url, label: Live website address, type: string, required: true }
      - { name: tagline, label: Tagline, type: string }
      - { name: defaultDescription, label: Default meta description, type: text }
      - { name: phone, label: Phone, type: string }
      - { name: email, label: Email, type: string }
      - name: address
        label: Address
        type: object
        fields:
          - { name: street, label: Street, type: string }
          - { name: town, label: Town, type: string }
          - { name: county, label: County, type: string }
          - { name: postcode, label: Postcode, type: string }
      - { name: regions, label: Region order (for area lists), type: string, list: true }
      - { name: openingHours, label: 'Opening hours for Google (e.g. Mo-Sa 08:00-18:00)', type: string }
      - { name: openingHoursText, label: 'Opening hours shown on site (e.g. Monday to Saturday, 8am to 6pm)', type: string }
      - { name: priceRange, label: Price range (e.g. ££), type: string }
      - { name: logo, label: Logo, type: image }
      - { name: teamPhoto, label: Team photo (home and About pages), type: image }
      - { name: teamPhotoAlt, label: Team photo description (alt text), type: text }
      - { name: technicianPhoto, label: Technician photo (quote boxes and Contact page), type: image }
      - { name: technicianPhotoAlt, label: Technician photo description (alt text), type: text }
      - { name: formAction, label: Contact form endpoint (e.g. Formspree URL), type: string }
      - name: reviews
        label: Google reviews
        type: object
        fields:
          - { name: heading, label: Heading, type: string }
          - { name: summary, label: "Summary (e.g. Rated 5 Stars by Our Customers)", type: string }
          - name: platforms
            label: Review platforms
            type: object
            list: true
            fields:
              - { name: name, label: Platform name, type: string }
              - { name: url, label: Link to your reviews, type: string }
          - { name: url, label: Main reviews link, type: string }
          - { name: writeUrl, label: Leave a Google review link, type: string }
          - name: items
            label: Reviews (copy real reviews from Google)
            type: object
            list: true
            fields:
              - { name: name, label: Reviewer name, type: string }
              - { name: town, label: Town (optional), type: string }
              - { name: rating, label: Stars (1–5), type: number }
              - { name: date, label: "Date (e.g. March 2026)", type: string }
              - { name: source, label: "Where it was posted (e.g. Google, Trustpilot)", type: string }
              - { name: text, label: Review text, type: text }
      - name: social
        label: Social profiles
        type: object
        fields:
          - { name: facebook, label: Facebook URL, type: string }
          - { name: instagram, label: Instagram URL, type: string }
          - { name: youtube, label: YouTube URL, type: string }
          - { name: linkedin, label: LinkedIn URL, type: string }
          - { name: x, label: X (Twitter) URL, type: string }
          - { name: google, label: Google Business Profile URL, type: string }
          - { name: trustpilot, label: Trustpilot URL, type: string }
          - { name: reviewsio, label: Reviews.io URL, type: string }
      - name: nav
        label: Menu
        type: object
        list: true
        fields:
          - { name: label, label: Label, type: string }
          - { name: url, label: Link, type: string }
